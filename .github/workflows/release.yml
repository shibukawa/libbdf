name: release

# A tag v<version> makes a draft release with what packaging/README.md
# lists: the single header, the binaries of each platform, the xcframework,
# the NuGet packages and the Android library; and publishes the Android
# library on Maven Central. Dispatched by hand, or for a pull request that
# changes this file or the scripts it runs, it builds the same, checks that
# every file of a release is there (packaging/release-files.sh) and leaves
# them as artifacts of the run, without a release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/binaries.sh"
      - "packaging/xcframework.sh"
      - "packaging/release-files.sh"
      - "android/libbdf/build.gradle.kts"
      - "packaging/maven-central.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python3 tools/amalgamate.py -o dist/bdf.h
      - uses: actions/upload-artifact@v7
        with:
          name: single-header
          path: dist/bdf.h

  binaries:
    name: binaries-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest }
          - { platform: macos-universal, os: macos-latest }
          - { platform: windows-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - run: packaging/binaries.sh ${{ matrix.platform }} "$RUNNER_TEMP/binaries"
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/binaries/bdf-*.tar.gz
            ${{ runner.temp }}/binaries/bdf-*.zip

  xcframework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          packaging/xcframework.sh "$RUNNER_TEMP/xcframework"
          cd "$RUNNER_TEMP/xcframework"
          ditto -c -k --keepParent bdf.xcframework bdf.xcframework.zip
          # what a binaryTarget of a Swift package names
          swift package compute-checksum bdf.xcframework.zip | tee bdf.xcframework.zip.checksum
      - uses: actions/upload-artifact@v7
        with:
          name: xcframework
          path: |
            ${{ runner.temp }}/xcframework/bdf.xcframework.zip
            ${{ runner.temp }}/xcframework/bdf.xcframework.zip.checksum

  # The NuGet packages: the bindings with the shared library of each
  # platform in runtimes/<rid>/native, and the SkiaSharp adapter.
  nuget:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: ${{ runner.temp }}/binaries
      - name: The shared libraries of the binaries
        run: |
          cd "$RUNNER_TEMP/binaries"
          tar xzf binaries-linux-x64/bdf-*-linux-x64.tar.gz
          tar xzf binaries-macos-universal/bdf-*-macos-universal.tar.gz
          unzip -q binaries-windows-x64/bdf-*-windows-x64.zip
          native="$GITHUB_WORKSPACE/dotnet/LibBdf/runtimes"
          mkdir -p "$native"/{linux-x64,osx-arm64,osx-x64,win-x64}/native
          cp -L bdf-*-linux-x64/shared/lib/libbdf.so "$native/linux-x64/native/libbdf.so"
          cp -L bdf-*-macos-universal/shared/lib/libbdf.dylib "$native/osx-arm64/native/libbdf.dylib"
          cp -L bdf-*-macos-universal/shared/lib/libbdf.dylib "$native/osx-x64/native/libbdf.dylib"
          cp bdf-*-windows-x64/shared/bin/bdf.dll "$native/win-x64/native/bdf.dll"
      - name: Pack
        run: |
          version=$(sed -n 's/^#define BDF_VERSION_STRING *"\(.*\)"/\1/p' include/bdf/bdf.h)
          dotnet pack dotnet/LibBdf -c Release -p:Version="$version" -o "$RUNNER_TEMP/nupkg"
          dotnet pack dotnet/LibBdf.SkiaSharp -c Release -p:Version="$version" -o "$RUNNER_TEMP/nupkg"
      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: ${{ runner.temp }}/nupkg/*.nupkg

  # The Android library: the AAR with the native code of each ABI, and the
  # same as a Maven repository (AAR, POM, sources) in a zip, for a
  # repository of one's own or Maven Central.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The NDK and the CMake the build names
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null
      - run: android/gradlew -p android --console=plain :libbdf:assembleRelease :libbdf:publishReleasePublicationToBuildRepository
      - name: The files
        run: |
          version=$(sed -n 's/^#define BDF_VERSION_STRING *"\(.*\)"/\1/p' include/bdf/bdf.h)
          mkdir -p "$RUNNER_TEMP/android"
          cp android/libbdf/build/outputs/aar/libbdf-release.aar "$RUNNER_TEMP/android/libbdf-android-$version.aar"
          (cd android/libbdf/build/repo && zip -qr "$RUNNER_TEMP/android/libbdf-android-$version-maven.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ runner.temp }}/android/*

  # What a release would hold, checked on every run: the files of the other
  # jobs, each there and with what it is for inside.
  assets:
    needs: [single-header, binaries, xcframework, nuget, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/dist
      - run: packaging/release-files.sh "$RUNNER_TEMP/dist"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the version the header states
        run: |
          version=$(sed -n 's/^#define BDF_VERSION_STRING *"\(.*\)"/\1/p' include/bdf/bdf.h)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "the tag is $GITHUB_REF_NAME, the header says $version"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/dist
      - name: Draft the release
        run: |
          files=$(packaging/release-files.sh "$RUNNER_TEMP/dist")
          echo "$files"
          # (no path of them has a space in it)
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes $files

  # The Android library to Maven Central, as pgmem's release does: for a
  # tag it is signed with the key of the secrets of the release environment,
  # bundled, uploaded to the Central Portal (packaging/maven-central.sh) and
  # published once the Portal has validated it; a version already on Maven
  # Central is left as it is. Dispatched by hand, the Portal only validates
  # the bundle, which is then dropped. Without the secrets the job says so
  # and uploads nothing.
  maven-central:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: assets
    runs-on: ubuntu-latest
    environment: release
    env:
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: What to do
        id: plan
        run: |
          version=$(sed -n 's/^#define BDF_VERSION_STRING *"\(.*\)"/\1/p' include/bdf/bdf.h)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$ORG_GRADLE_PROJECT_signingKey" ] || [ -z "$CENTRAL_USERNAME" ] || [ -z "$CENTRAL_PASSWORD" ]; then
            echo "::notice::no secrets for Maven Central in the release environment (CENTRAL_USERNAME, CENTRAL_PASSWORD, GPG_PRIVATE_KEY, GPG_PASSPHRASE): nothing is uploaded"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && curl -sfI "https://repo1.maven.org/maven2/io/github/shibukawa/libbdf/libbdf/$version/libbdf-$version.pom" > /dev/null; then
            echo "::notice::io.github.shibukawa.libbdf:libbdf:$version is already on Maven Central"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The NDK and the CMake the build names
        if: steps.plan.outputs.skip != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null
      - name: Sign
        if: steps.plan.outputs.skip != 'true'
        run: android/gradlew -p android --console=plain :libbdf:publishReleasePublicationToBuildRepository
      - name: Bundle and upload
        if: steps.plan.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          bundle="$RUNNER_TEMP/libbdf-android-$VERSION-central.zip"
          packaging/maven-central.sh bundle android/libbdf/build/repo "$bundle"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            packaging/maven-central.sh upload "$bundle"
          else
            packaging/maven-central.sh upload --validate-only "$bundle"
          fi
