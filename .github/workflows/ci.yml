name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz-minutes:
        description: "Minutes to fuzz each target with libFuzzer and go test -fuzz (0 skips the fuzz job)"
        default: "0"

jobs:
  # Build and the unit tests on every platform the library is meant for,
  # against the sources and against the single-header form.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-gcc, os: ubuntu-latest, cc: gcc }
          - { name: ubuntu-clang, os: ubuntu-latest, cc: clang }
          - { name: macos, os: macos-latest, cc: clang }
          - { name: windows-msvc, os: windows-latest, cc: "" }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBDF_WERROR=ON -DBDF_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/prefix"
      - uses: actions/upload-artifact@v7
        if: matrix.name == 'ubuntu-clang'
        with:
          name: bdf-single-header
          path: build/single/bdf/bdf.h

  # The shared library, and the install rules a consumer sees.
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBDF_WERROR=ON -DBUILD_SHARED_LIBS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix "${{ runner.temp }}/prefix"
      - name: Check the installed package
        run: |
          ls -R "${{ runner.temp }}/prefix"
          PKG_CONFIG_PATH="${{ runner.temp }}/prefix/lib/pkgconfig" pkg-config --cflags --libs bdf
          test -f "${{ runner.temp }}/prefix/lib/cmake/bdf/bdfConfig.cmake"

  # The adapters, each where its library is: built with the warnings of the
  # library, and compared with the rasterizer on the pages built into its
  # comparison program (ctest adapter-<name>).
  adapters:
    name: adapter-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cairo, os: ubuntu-latest, packages: libcairo2-dev, flags: "-DBDF_CAIRO=ON" }
          - { name: coregraphics, os: macos-latest, packages: "", flags: "-DBDF_COREGRAPHICS=ON" }
          - { name: qt, os: ubuntu-latest, packages: qt6-base-dev, flags: "-DBDF_QT=ON" }
    steps:
      - uses: actions/checkout@v7
      - name: Install what the adapter draws with
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBDF_WERROR=ON ${{ matrix.flags }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -R '^(canvas|adapter-)'
      - name: Check the installed package
        run: |
          cmake --install build --prefix "${{ runner.temp }}/prefix"
          test -f "${{ runner.temp }}/prefix/include/bdf/bdf_${{ matrix.name }}.h"
          test -f "${{ runner.temp }}/prefix/lib/libbdf_${{ matrix.name }}.a"

  # The Skia adapter, against a build of Skia: Skia has no releases of its
  # own, and this is the one Aseprite publishes for its builds
  # (github.com/aseprite/skia), of the milestone the adapter is written for.
  adapter-skia:
    runs-on: macos-latest
    env:
      SKIA_URL: https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-macOS-Release-arm64.zip
      SKIA_SHA256: ""
    steps:
      - uses: actions/checkout@v7
      - name: Fetch a build of Skia
        run: |
          curl -fsSL -o "$RUNNER_TEMP/skia.zip" "$SKIA_URL"
          shasum -a 256 "$RUNNER_TEMP/skia.zip"
          if [ -n "$SKIA_SHA256" ]; then echo "$SKIA_SHA256  $RUNNER_TEMP/skia.zip" | shasum -a 256 -c -; fi
          mkdir "$RUNNER_TEMP/skia"
          unzip -q "$RUNNER_TEMP/skia.zip" -d "$RUNNER_TEMP/skia"
          ls "$RUNNER_TEMP/skia" "$RUNNER_TEMP/skia/out"/*
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBDF_WERROR=ON -DBDF_SKIA=ON -DBDF_SKIA_DIR="$RUNNER_TEMP/skia"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -R '^(canvas|adapter-)'

  # The unit tests once more under AddressSanitizer and UndefinedBehaviorSanitizer.
  # Fuzzing is not run here (see the fuzz job): this replays what the tests
  # already have, which takes seconds and catches most of what a fuzzer would.
  sanitize:
    runs-on: ubuntu-latest
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBDF_WERROR=ON -DBDF_SANITIZE=address,undefined
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # The differential tests against the Go reference implementation: every
  # document and object of bdf's testdata through both readers, with the C
  # side under ASan.
  differential:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go test -asan ./...

  # Fuzzing, on request only: workflow_dispatch with fuzz-minutes > 0.
  fuzz:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.fuzz-minutes != '0'
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum
      - name: libFuzzer
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBDF_BUILD_FUZZ=ON -DBDF_SANITIZE=address,undefined -DBDF_BUILD_TESTS=OFF
          cmake --build build
          mkdir -p fuzz/findings
          for t in object inflate manifest doc woff2 text unlock search render image font; do
            mkdir -p "fuzz/corpus/$t"
            "./build/fuzz/${t}_fuzz" "fuzz/corpus/$t" -max_total_time=$(( ${{ github.event.inputs.fuzz-minutes }} * 60 )) -artifact_prefix="fuzz/findings/$t-"
          done
      - name: go test -fuzz
        working-directory: go
        run: |
          for t in FuzzObject FuzzInflate FuzzDoc FuzzWOFF2 FuzzText FuzzIndexPart FuzzUnlock FuzzSealed FuzzNFC FuzzGCM FuzzP256 FuzzPNG FuzzJpeg FuzzGif FuzzBmp FuzzWebp FuzzFont; do
            go test -run '^$' -fuzz "^$t\$" -fuzztime "${{ github.event.inputs.fuzz-minutes }}m" -fuzzminimizetime 20x .
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-findings
          path: |
            fuzz/findings/
            go/testdata/fuzz/
          if-no-files-found: ignore
