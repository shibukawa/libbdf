name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz-minutes:
        description: "Minutes to fuzz each target with libFuzzer and go test -fuzz (0 skips the fuzz job)"
        default: "0"

jobs:
  # Build and the unit tests on every platform the library is meant for,
  # against the sources and against the single-header form.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-gcc, os: ubuntu-latest, cc: gcc }
          - { name: ubuntu-clang, os: ubuntu-latest, cc: clang }
          - { name: macos, os: macos-latest, cc: clang }
          - { name: windows-msvc, os: windows-latest, cc: "" }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBDF_WERROR=ON -DBDF_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/prefix"
      - uses: actions/upload-artifact@v7
        if: matrix.name == 'ubuntu-clang'
        with:
          name: bdf-single-header
          path: build/single/bdf/bdf.h

  # The shared library, and the install rules a consumer sees.
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBDF_WERROR=ON -DBUILD_SHARED_LIBS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix "${{ runner.temp }}/prefix"
      - name: Check the installed package
        run: |
          ls -R "${{ runner.temp }}/prefix"
          PKG_CONFIG_PATH="${{ runner.temp }}/prefix/lib/pkgconfig" pkg-config --cflags --libs bdf
          test -f "${{ runner.temp }}/prefix/lib/cmake/bdf/bdfConfig.cmake"

  # The adapters, each where its library is: built with the warnings of the
  # library, and compared with the rasterizer on the pages built into its
  # comparison program (ctest adapter-<name>).
  adapters:
    name: adapter-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cairo, os: ubuntu-latest, packages: libcairo2-dev, flags: "-DBDF_CAIRO=ON" }
          - { name: coregraphics, os: macos-latest, packages: "", flags: "-DBDF_COREGRAPHICS=ON" }
          - { name: qt, os: ubuntu-latest, packages: qt6-base-dev, flags: "-DBDF_QT=ON" }
    steps:
      - uses: actions/checkout@v7
      - name: Install what the adapter draws with
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBDF_WERROR=ON ${{ matrix.flags }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -R '^(canvas|adapter-)'
      - name: How far from the rasterizer
        run: ./build/adapters/compare_${{ matrix.name }}
      - name: Check the installed package
        run: |
          cmake --install build --prefix "${{ runner.temp }}/prefix"
          test -f "${{ runner.temp }}/prefix/include/bdf/bdf_${{ matrix.name }}.h"
          test -f "${{ runner.temp }}/prefix/lib/libbdf_${{ matrix.name }}.a"

  # The Skia adapter, against a build of Skia: Skia has no releases of its
  # own, and this is the one Aseprite publishes for its builds
  # (github.com/aseprite/skia), of the milestone the adapter is written for.
  adapter-skia:
    runs-on: macos-latest
    env:
      SKIA_URL: https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-macOS-Release-arm64.zip
      SKIA_SHA256: 22663000967fc2c3f1a78190082228474955de02ffd13a352b39a48b204dac9a
    steps:
      - uses: actions/checkout@v7
      - name: Fetch a build of Skia
        run: |
          curl -fsSL -o "$RUNNER_TEMP/skia.zip" "$SKIA_URL"
          echo "$SKIA_SHA256  $RUNNER_TEMP/skia.zip" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/skia"
          unzip -q "$RUNNER_TEMP/skia.zip" -d "$RUNNER_TEMP/skia"
          ls "$RUNNER_TEMP/skia" "$RUNNER_TEMP/skia/out"/*
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBDF_WERROR=ON -DBDF_SKIA=ON -DBDF_SKIA_DIR="$RUNNER_TEMP/skia"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -R '^(canvas|adapter-)'
      - name: How far from the rasterizer
        run: ./build/adapters/compare_skia

  # The ways the library reaches other builds (packaging/README.md): a
  # consumer built through each of them.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the library
        run: |
          echo "PREFIX=$RUNNER_TEMP/prefix" >> "$GITHUB_ENV"
          PREFIX=$RUNNER_TEMP/prefix
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBDF_BUILD_TESTS=OFF
          cmake --build build
          cmake --install build --prefix "$PREFIX"
      - name: CMake package
        run: |
          cmake -S packaging/consumer -B "$RUNNER_TEMP/consumer" -DCMAKE_PREFIX_PATH="$PREFIX"
          cmake --build "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/consumer"
      - name: pkg-config
        run: |
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          cc packaging/consumer/main.c $(pkg-config --cflags --libs --static bdf) -o "$RUNNER_TEMP/consumer-pc"
          "$RUNNER_TEMP/consumer-pc"
      - name: Conan
        run: |
          pipx install conan
          conan profile detect
          conan create . --test-folder=packaging/conan/test_package
      - name: vcpkg
        env:
          BDF_VCPKG_SOURCE: ${{ github.workspace }}
          VCPKG_KEEP_ENV_VARS: BDF_VCPKG_SOURCE
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install bdf --overlay-ports=packaging/vcpkg
          cmake -S packaging/consumer -B "$RUNNER_TEMP/consumer-vcpkg" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build "$RUNNER_TEMP/consumer-vcpkg"
          "$RUNNER_TEMP/consumer-vcpkg/consumer"
      - name: Meson
        run: |
          pipx install meson
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          mkdir -p packaging/meson/test/subprojects
          cp packaging/meson/bdf.wrap packaging/meson/test/subprojects/
          # the subproject is this checkout, not the release the wrap names
          ln -s "$GITHUB_WORKSPACE" packaging/meson/test/subprojects/bdf
          meson setup "$RUNNER_TEMP/meson" packaging/meson/test
          meson test -C "$RUNNER_TEMP/meson" --print-errorlogs

  # The binaries of a release, as the release workflow builds them.
  packaging-binaries:
    name: binaries-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest }
          - { platform: macos-universal, os: macos-latest }
          - { platform: windows-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - run: packaging/binaries.sh ${{ matrix.platform }} "$RUNNER_TEMP/binaries"
        shell: bash
      - name: A consumer of the tree
        shell: bash
        run: |
          tree=$(echo "$RUNNER_TEMP"/binaries/bdf-*-${{ matrix.platform }})
          ls -R "$tree" | head -60
          cmake -S packaging/consumer -B "$RUNNER_TEMP/consumer" -DCMAKE_PREFIX_PATH="$tree"
          cmake --build "$RUNNER_TEMP/consumer" --config Release
          ctest --test-dir "$RUNNER_TEMP/consumer" -C Release --output-on-failure

  # libbdf for .NET (dotnet/): the bindings and the SkiaSharp adapter built and
  # tested against the shared library, and the NuGet packages packed.
  packaging-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The shared library
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBDF_BUILD_TESTS=OFF
          cmake --build build
      - name: Test
        run: LD_LIBRARY_PATH="$PWD/build" dotnet test dotnet/LibBdf.Tests -c Release
      - name: Pack
        run: |
          mkdir -p dotnet/LibBdf/runtimes/linux-x64/native
          cp -L build/libbdf.so dotnet/LibBdf/runtimes/linux-x64/native/libbdf.so
          dotnet pack dotnet/LibBdf -c Release -o "$RUNNER_TEMP/nupkg"
          dotnet pack dotnet/LibBdf.SkiaSharp -c Release -o "$RUNNER_TEMP/nupkg"
          for p in "$RUNNER_TEMP"/nupkg/*.nupkg; do unzip -l "$p"; done

  # The Swift package and the xcframework.
  packaging-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      - run: swift test
      - name: xcframework
        run: |
          packaging/xcframework.sh "$RUNNER_TEMP/xcframework"
          ls -R "$RUNNER_TEMP/xcframework/bdf.xcframework" | head -40

  # The unit tests once more under AddressSanitizer and UndefinedBehaviorSanitizer.
  # Fuzzing is not run here (see the fuzz job): this replays what the tests
  # already have, which takes seconds and catches most of what a fuzzer would.
  sanitize:
    runs-on: ubuntu-latest
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBDF_WERROR=ON -DBDF_SANITIZE=address,undefined
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # The differential tests against the Go reference implementation: every
  # document and object of bdf's testdata through both readers, with the C
  # side under ASan.
  differential:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test ./...
      # (with -short: a part of the random cases, at a tenth of the speed)
      - run: go test -asan -short -timeout 30m ./...

  # The conformance suite of bdf (its package conformance, `bdf conformance`):
  # written by the version of bdf the harness is pinned to (go/go.mod), from
  # that version's test documents, and run by test_conformance. bdf has the
  # suite from 0.1.6 on; pinned to a version before it, the job says so and
  # runs nothing.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum
      - name: Write the suite
        id: suite
        working-directory: go
        run: |
          # (go list says where a module is only once it is in the module cache)
          go mod download github.com/shibukawa/bdf
          dir=$(go list -m -f '{{.Dir}}' github.com/shibukawa/bdf)
          version=$(go list -m -f '{{.Version}}' github.com/shibukawa/bdf)
          if [ -z "$dir" ] || [ ! -d "$dir/testdata" ]; then
            echo "::error::bdf $version is not in the module cache: '$dir'"
            exit 1
          fi
          if [ ! -d "$dir/conformance" ]; then
            echo "::notice::bdf $version has no conformance suite: nothing is run"
            exit 0
          fi
          go run "github.com/shibukawa/bdf/cmd/bdf@$version" conformance -testdata "$dir/testdata" "$RUNNER_TEMP/suite"
          echo "dir=$RUNNER_TEMP/suite" >> "$GITHUB_OUTPUT"
      - name: Run it
        if: steps.suite.outputs.dir != ''
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBDF_CONFORMANCE_DIR="${{ steps.suite.outputs.dir }}"
          cmake --build build --target test_conformance
          ctest --test-dir build -R '^conformance$' --output-on-failure --no-tests=error

  # Fuzzing, on request only: workflow_dispatch with fuzz-minutes > 0.
  fuzz:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.fuzz-minutes != '0'
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum
      - name: libFuzzer
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBDF_BUILD_FUZZ=ON -DBDF_SANITIZE=address,undefined -DBDF_BUILD_TESTS=OFF
          cmake --build build
          mkdir -p fuzz/findings
          for t in object inflate manifest doc woff2 text unlock search render image font svg svgdoc; do
            mkdir -p "fuzz/corpus/$t"
            "./build/fuzz/${t}_fuzz" "fuzz/corpus/$t" -max_total_time=$(( ${{ github.event.inputs.fuzz-minutes }} * 60 )) -artifact_prefix="fuzz/findings/$t-"
          done
      - name: go test -fuzz
        working-directory: go
        run: |
          for t in FuzzObject FuzzInflate FuzzDoc FuzzWOFF2 FuzzText FuzzIndexPart FuzzUnlock FuzzSealed FuzzNFC FuzzGCM FuzzP256 FuzzPNG FuzzJpeg FuzzGif FuzzBmp FuzzWebp FuzzFont; do
            go test -run '^$' -fuzz "^$t\$" -fuzztime "${{ github.event.inputs.fuzz-minutes }}m" -fuzzminimizetime 20x .
          done
          # the reader of SVG documents has its tests in a package of its own
          go test -run '^$' -fuzz '^FuzzSVG$' -fuzztime "${{ github.event.inputs.fuzz-minutes }}m" -fuzzminimizetime 20x ./svgdoc
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-findings
          path: |
            fuzz/findings/
            go/testdata/fuzz/
          if-no-files-found: ignore
